const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
function lock(){byId('content').replaceChildren();byId('content').hidden=true;byId('gate').hidden=false;byId('pw').value='';byId('msg').textContent='';if(location.hash)history.replaceState(null,'',location.pathname);window.scrollTo(0,0)}

byId('form').addEventListener('submit',async event=>{
 event.preventDefault();const button=event.submitter||byId('form').querySelector('button');button.disabled=true;
 try{
 const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(byId('pw').value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:decode(packet.salt),iterations:600000},raw,{name:'AES-GCM',length:256},false,['decrypt']);
