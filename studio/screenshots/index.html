const byId=id=>document.getElementById(id);
const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
function lock(){byId('content').replaceChildren();byId('content').hidden=true;byId('gate').hidden=false;byId('pw').value='';byId('msg').textContent='';if(location.hash)history.replaceState(null,'',location.pathname);window.scrollTo(0,0)}

byId('form').addEventListener('submit',async event=>{
 event.preventDefault();const button=event.submitter||byId('form').querySelector('button');button.disabled=true;
 try{
 const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(byId('pw').value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:decode(packet.salt),iterations:600000},raw,{name:'AES-GCM',length:256},false,['decrypt']);
 const html=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(packet.iv)},key,decode(packet.body));
 const unpacked=new Blob([html]).stream().pipeThrough(new DecompressionStream('gzip'));
 byId('content').innerHTML=await new Response(unpacked).text();byId('pw').value='';byId('gate').hidden=true;byId('content').hidden=false;byId('relock').onclick=()=>{lock();byId('pw').focus()};const binding=byId('content').querySelector('script[data-studio-controls]');if(binding){const script=document.createElement('script');script.textContent=binding.textContent;binding.replaceWith(script)}byId('relock').focus({preventScroll:true});
 }catch{byId('msg').textContent='Couldn’t unlock Hype HQ. Check your password and try again.'}finally{button.disabled=false}
});
